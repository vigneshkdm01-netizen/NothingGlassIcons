name: Build Nothing Glass Icons APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -q NothingGlassIcons_Source.zip -d extracted
          ls -la extracted/NothingGlassForge

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        working-directory: extracted/NothingGlassForge
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NothingGlassIcons-APK
          path: extracted/NothingGlassForge/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
